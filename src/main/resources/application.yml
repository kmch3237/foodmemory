spring:
  application:
    name: foodmemory

  # ── DB 연결 정보 ────────────────────────────────────────────
  datasource:
    # jdbc:mysql://호스트:포트/데이터베이스이름?옵션
    #   serverTimezone     : 시간대. 지정하지 않으면 서버 기본 시간대를 따라가
    #                        저장한 시각이 9시간 어긋나는 사고가 난다.
    #   characterEncoding  : 한글이 깨지지 않도록 UTF-8 로 주고받는다.
    url: jdbc:mysql://localhost:3306/foodmemory?serverTimezone=Asia/Seoul&characterEncoding=UTF-8

    # 계정 정보는 환경마다 다르다. 내 노트북은 localhost 지만 서버는 RDS 주소다.
    # ${환경변수:기본값} 형식이라, 환경변수가 없으면 뒤의 기본값을 쓴다.
    # 공개 레포에 비밀번호를 올리지 않기 위한 장치다.
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

    driver-class-name: com.mysql.cj.jdbc.Driver

  # ── JPA 동작 방식 ───────────────────────────────────────────
  jpa:
    hibernate:
      # ⚠️ 이 한 줄이 이 프로젝트에서 가장 중요한 설정이다.
      #   none     : JPA 가 테이블에 아무것도 하지 않는다
      #   validate : 엔티티와 실제 테이블이 일치하는지 검사만 한다. 다르면 실행 실패
      #   update   : JPA 가 테이블을 마음대로 고친다     ← 절대 쓰지 않는다
      #   create   : 실행할 때마다 테이블을 지우고 새로 만든다 ← 데이터가 날아간다
      #
      # "테이블은 내가 DDL 로 만든다. JPA 는 검사만 해라" 는 선언이다.
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true   # 콘솔에 찍히는 SQL 을 보기 좋게 줄바꿈한다

    # 영속성 컨텍스트를 화면 렌더링까지 열어두는 기능을 끈다.
    # 기본값(true)이면 DB 커넥션을 화면 그릴 때까지 붙잡고 있어 성능에 불리하다.
    # 왜 꺼야 하는지는 영속성 컨텍스트를 배울 때 자세히 다룬다.
    open-in-view: false

  # ── 파일 업로드 제한 ────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB       # 파일 하나당 최대 크기
      max-request-size: 50MB    # 한 번 요청에 담기는 전체 크기 (사진 여러 장)

  # ── Thymeleaf ──────────────────────────────────────────────
  thymeleaf:
    # 개발 중에는 캐시를 꺼야 HTML 을 고쳤을 때 바로 반영된다.
    # 운영에서는 true 로 두어야 매번 파일을 다시 읽지 않는다.
    cache: false

# ── 톰캣 · 세션 ───────────────────────────────────────────────
# spring.servlet 이 아니라 server.servlet 아래라는 점을 헷갈리기 쉽다.
#   spring.servlet.multipart  → 업로드 제한 (스프링이 처리)
#   server.servlet.session    → 세션 (톰캣이 처리)
# 잘못된 자리에 적어도 오류가 나지 않고 조용히 무시된다.
server:
  servlet:
    session:
      # 세션 ID 를 쿠키로만 주고받는다.
      #
      # 이 설정이 없으면 톰캣이 쿠키를 못 쓰는 브라우저를 대비해
      # 주소 뒤에 ;jsessionid=... 를 붙이는 방식을 함께 쓴다.
      # 그러면 세션 ID 가 브라우저 기록, 서버 접근 로그, 그리고 다른 사이트로
      # 넘어가는 Referer 헤더에까지 남는다. 그 값 하나면 남의 로그인 상태를 그대로 쓸 수 있다.
      tracking-modes: cookie

      cookie:
        # 자바스크립트에서 이 쿠키를 읽지 못하게 한다.
        # 화면에 악성 스크립트가 끼어들어도 세션 ID 를 훔쳐 나갈 수 없다.
        http-only: true

        # 다른 사이트에서 우리 사이트로 보내는 요청에는 쿠키를 붙이지 않는다.
        # 사용자가 모르는 사이에 요청이 대신 보내지는 것(CSRF)을 막는다.
        same-site: lax

        # secure: true 는 HTTPS 에서만 쿠키를 보내라는 뜻이라 지금은 켜지 않는다.
        # 로컬 개발은 http 라서 켜면 로그인 자체가 되지 않는다. 배포할 때 켠다.


# ── 로그 ──────────────────────────────────────────────────────
# JPA 가 실제로 어떤 SQL 을 만들어 보내는지 콘솔에서 볼 수 있게 한다.
# JPA 를 배우는 동안에는 반드시 켜둔다. N+1 문제도 이걸로 발견한다.
logging:
  level:
    org.hibernate.SQL: debug              # 실행되는 SQL
    org.hibernate.orm.jdbc.bind: trace    # ? 자리에 들어간 실제 값

# ── 이 애플리케이션만의 설정 ────────────────────────────────────
# spring 으로 시작하지 않는 것은 Spring 이 정한 것이 아니라 우리가 만든 설정이다.
app:
  # 카카오 REST API 키.
  # 값을 여기에 직접 적으면 깃에 그대로 올라가므로 환경변수로만 받는다.
  # 실행 전에 터미널에서 export KAKAO_REST_API_KEY=... 를 해둔다.
  # 기본값을 빈 문자열로 둔 이유는, 키가 없어도 앱은 뜨고 식당 검색만 건너뛰게 하기 위해서다.
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    search-radius: 200   # 좌표 주변 몇 미터까지 검색할지

  # 소셜 로그인.
  #
  # 값을 여기에 직접 적지 않는 이유는 지도 API 키와 같다. 깃에 그대로 올라간다.
  # client-secret 은 특히 중요하다. 이 값이 있으면 남이 우리 앱인 척하고
  # 사용자 정보를 받아갈 수 있다.
  #
  # redirect-uri 는 제공자 콘솔에 등록한 주소와 글자 하나까지 같아야 한다.
  # 다르면 제공자가 요청을 거부한다. 흔히 겪는 실수라서 기본값을 적어둔다.
  oauth:
    kakao:
      # 지도 API 와 같은 REST API 키를 쓴다. 카카오는 앱 하나에 키가 하나다.
      client-id: ${KAKAO_REST_API_KEY:}
      # 콘솔에서 [카카오 로그인] > [보안] 의 Client Secret 을 켰을 때만 필요하다.
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/oauth/kakao/callback}

    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      # 구글은 이 값이 항상 필요하다.
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/oauth/google/callback}

  upload:
    # 실제 파일이 저장될 폴더. 환경마다 다르므로 환경변수로 뺄 수 있게 해둔다.
    # 나중에 S3 로 바꾸면 이 값 대신 버킷 정보가 들어간다.
    path: ${UPLOAD_PATH:./uploads}

    # 브라우저가 사진을 볼 때 쓰는 주소의 앞부분.
    # DB 에는 이 앞부분을 저장하지 않는다. 저장하면 도메인이 바뀔 때 전부 고쳐야 한다.
    url-prefix: /uploads
