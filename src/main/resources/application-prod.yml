# 운영(EC2)에서만 쓰는 설정.
#
# ── 이 파일이 왜 필요한가 ──
#
# 개발과 운영은 사정이 다르다. 그런데 설정 파일이 하나뿐이면 둘 중 하나를 포기해야 한다.
#   캐시를 켜면  → 로컬에서 HTML 을 고쳐도 화면이 안 바뀐다
#   캐시를 끄면  → 운영에서 요청마다 파일을 다시 읽는다
# 어느 쪽을 골라도 한쪽이 손해다.
#
# 그래서 스프링은 '프로파일' 이라는 이름표를 쓴다.
#   application.yml       → 항상 읽는다 (공통 + 로컬 기본값)
#   application-prod.yml  → prod 이름표가 붙었을 때만 추가로 읽는다
# 같은 항목이 양쪽에 있으면 이 파일이 이긴다. 여기 없는 것은 application.yml 그대로다.
#
# ── 이름표를 붙이는 방법 ──
# 서버에서 앱을 띄울 때 환경변수로 알려준다.
#   SPRING_PROFILES_ACTIVE=prod
# 이 값이 없으면 이 파일은 읽히지 않고, 로컬은 지금까지처럼 동작한다.

spring:
  thymeleaf:
    # 화면 틀(HTML)을 한 번 읽고 기억해둔다.
    #
    # 로컬에서 끄는 이유는 파일을 고치는 즉시 확인하기 위해서다.
    # 운영에서는 파일이 바뀔 일이 없다. 배포할 때 통째로 새로 올라가고 앱도 다시 뜬다.
    # 그런데 꺼두면 사진 목록 한 번 볼 때마다 디스크에서 HTML 을 다시 읽는다.
    # 디스크는 메모리보다 훨씬 느리다. 켜두는 것이 맞다.
    cache: true

  jpa:
    properties:
      hibernate:
        # SQL 을 보기 좋게 줄바꿈하는 기능. 사람이 읽을 때만 쓸모가 있다.
        # 운영 로그는 사람이 눈으로 따라가지 않으므로 줄 수만 늘린다.
        format_sql: false

server:
  servlet:
    session:
      cookie:
        # 이 쿠키를 HTTPS 연결에서만 보낸다.
        #
        # 왜 로컬에서는 못 켜는가:
        #   로컬은 http://localhost 라 암호화되지 않은 연결이다.
        #   여기서 켜면 브라우저가 쿠키를 아예 보내지 않아 로그인 자체가 안 된다.
        #
        # 왜 운영에서는 켜야 하는가:
        #   이 쿠키 하나면 남의 로그인 상태를 그대로 쓸 수 있다.
        #   http 로도 보내지게 두면 카페 와이파이 같은 곳에서 오가는 값을
        #   중간에서 그대로 주워 담을 수 있다. mealmates.duckdns.org 는 HTTPS 이므로
        #   켜도 아무 문제가 없고, 켜지 않을 이유가 없다.
        secure: true

# ── 로그 ──────────────────────────────────────────────────────
# 운영에서는 SQL 로그를 끈다.
#
# 로컬에서 켜두는 이유는 JPA 가 실제로 어떤 SQL 을 보내는지 배우기 위해서다.
# 운영에서 같은 설정을 쓰면 두 가지 문제가 생긴다.
#
#   1. 개인정보가 로그에 쌓인다
#      bind: trace 는 ? 자리에 들어간 '실제 값' 을 찍는다.
#      회원 이메일, 닉네임, 소셜 회원번호가 그대로 로그 파일에 남는다.
#      로그는 보통 아무나 열어볼 수 있는 평범한 파일이다.
#
#   2. 디스크가 찬다
#      요청 하나에 SQL 이 여러 개 나간다. 사용자가 늘수록 걷잡을 수 없이 커진다.
#      EC2 디스크가 차면 앱이 아니라 서버 전체가 멈춘다.
#
# warn 은 '문제가 있을 때만 알려달라' 는 뜻이다. 평상시에는 조용하다.
logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
