<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>가입 마무리</title>
    <style>
        body { max-width: 400px; margin: 0 auto; padding: 24px 16px;
               font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
        .done { padding: 12px; background: #f4f8f4; border-radius: 6px;
                font-size: 14px; color: #2a6b2a; margin-bottom: 20px; }
        label.field { display: block; margin-top: 16px; font-size: 14px; }
        input[type=text] { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        .terms { margin-top: 24px; border-top: 1px solid #eee; padding-top: 16px; }
        .terms label { display: block; margin-top: 10px; font-size: 14px; }
        .terms a { color: #666; font-size: 12px; }
        button { width: 100%; padding: 12px; margin-top: 20px; cursor: pointer; }
        .error { color: #c00; font-size: 14px; margin-top: 12px; }
        .hint { color: #888; font-size: 12px; margin-top: 4px; }
    </style>
</head>
<body>

<h1>가입 마무리</h1>

<!--
  본인 확인은 이미 끝났다는 것을 알려준다.
  이 화면이 왜 뜨는지 모르면 사용자는 "로그인했는데 왜 또?" 라고 느낀다.
-->
<div class="done">
    <span th:text="${provider}">KAKAO</span> 인증이 완료되었습니다.
    아래 내용을 확인하면 가입이 끝납니다.
</div>

<p class="error" th:if="${error}" th:text="${error}">오류 메시지</p>

<form th:action="@{/signup/social}" method="post">

    <!--
      제공자가 알려준 이름을 미리 채워둔다. 사용자가 바꿔도 된다.
      여기 없는 것: 제공자 종류와 회원 번호.
      그 값들은 세션에만 두고 화면으로 내보내지 않는다.
      화면에 실으면 조작해서 남의 계정을 만들 수 있기 때문이다.
    -->
    <label class="field">닉네임
        <input type="text" name="nickname" th:value="${nickname}" maxlength="50" required>
        <div class="hint">갤러리에 표시되는 이름입니다. 나중에 바꿀 수 있습니다.</div>
    </label>

    <!-- 이메일은 보여주기만 한다. 제공자가 확인해준 값이라 여기서 고치게 두지 않는다 -->
    <p class="hint" th:if="${email != null}">
        이메일: <span th:text="${email}">이메일</span>
    </p>
    <p class="hint" th:if="${email == null}">
        이 계정은 이메일 정보를 제공하지 않았습니다.
    </p>

    <div class="terms">
        <!--
          required 를 붙이면 브라우저가 체크하지 않은 채로는 보내지 않는다.
          다만 이건 편의일 뿐이라 서버에서 한 번 더 확인한다.
          개발자 도구로 지우거나 curl 로 직접 보내면 그냥 통과하기 때문이다.
        -->
        <label>
            <input type="checkbox" name="agreeTerms" value="true" required>
            <strong>[필수]</strong> 이용약관에 동의합니다
        </label>

        <label>
            <input type="checkbox" name="agreePrivacy" value="true" required>
            <strong>[필수]</strong> 개인정보 처리방침에 동의합니다
        </label>
    </div>

    <button type="submit">동의하고 가입 완료</button>
</form>

<p class="hint" style="margin-top:16px">
    <a th:href="@{/login}">가입하지 않고 돌아가기</a>
</p>

</body>
</html>
