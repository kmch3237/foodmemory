<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('가입 마무리 · mealmate')}"></head>
<body>

<div class="sheet">

    <th:block th:replace="~{fragments/layout :: pageTop(null)}"></th:block>

    <div class="column">

    <p class="section">가입 마무리</p>

    <!--
      본인 확인은 이미 끝났다는 것을 알려준다.
      이 화면이 왜 뜨는지 모르면 사용자는 "로그인했는데 왜 또?" 라고 느낀다.
    -->
    <div class="msg">
        <span th:text="${provider}">KAKAO</span> 인증이 완료되었습니다.
        아래 내용을 확인하면 가입이 끝납니다.
    </div>

    <div class="msg err" th:if="${error}" th:text="${error}">오류 메시지</div>

    <form th:action="@{/signup/social}" method="post">

        <!--
          제공자가 알려준 이름을 미리 채워둔다. 사용자가 바꿔도 된다.
          여기 없는 것: 제공자 종류와 회원 번호.
          그 값들은 세션에만 두고 화면으로 내보내지 않는다.
          화면에 실으면 조작해서 남의 계정을 만들 수 있기 때문이다.
        -->
        <label class="field">
            <span>닉네임</span>
            <input type="text" name="nickname" th:value="${nickname}" maxlength="50" required>
            <span class="hint">갤러리에 표시되는 이름입니다. 나중에 바꿀 수 있습니다.</span>
        </label>

        <!-- 이메일은 보여주기만 한다. 제공자가 확인해준 값이라 여기서 고치게 두지 않는다 -->
        <p class="hint" th:if="${email != null}">
            이메일: <span th:text="${email}">이메일</span>
        </p>
        <p class="hint" th:if="${email == null}">
            이 계정은 이메일 정보를 제공하지 않았습니다.
        </p>

        <div class="box sketch">
            <!--
              required 를 붙이면 브라우저가 체크하지 않은 채로는 보내지 않는다.
              다만 이건 편의일 뿐이라 서버에서 한 번 더 확인한다.
            -->
            <label>
                <input type="checkbox" name="agreeTerms" value="true" required>
                <strong>[필수]</strong> 이용약관에 동의합니다
            </label>
            <label>
                <input type="checkbox" name="agreePrivacy" value="true" required>
                <strong>[필수]</strong> 개인정보 처리방침에 동의합니다
            </label>
        </div>

        <button type="submit" class="btn wide">동의하고 가입 완료</button>
    </form>

    <p class="foot"><a class="link" th:href="@{/login}">가입하지 않고 돌아가기</a></p>

    </div>
</div>

</body>
</html>
