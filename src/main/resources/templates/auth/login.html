<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('로그인 · mealmate')}"></head>
<body>

<div class="sheet">

    <th:block th:replace="~{fragments/layout :: pageTop(null)}"></th:block>

    <div class="column">

    <p class="section">로그인</p>

    <div class="msg err" th:if="${error}" th:text="${error}">오류 메시지</div>

    <form th:action="@{/login}" method="post">
        <!--
          로그인하지 않은 채로 가려던 주소를 그대로 들고 다닌다.
          화면에 보일 필요는 없으므로 hidden 으로 둔다.
        -->
        <input type="hidden" name="redirectUrl" th:value="${redirectUrl}">

        <label class="field">
            <span>이메일</span>
            <!-- th:value 로 방금 입력한 값을 되살려, 실패했을 때 처음부터 다시 쓰지 않게 한다 -->
            <input type="email" name="email" th:value="${email}" required autofocus>
        </label>

        <label class="field">
            <span>비밀번호</span>
            <!-- 비밀번호는 되살리지 않는다. 화면 소스에 남을 이유가 없다 -->
            <input type="password" name="password" required>
        </label>

        <button type="submit" class="btn wide">로그인</button>
    </form>

    <div class="section-gap">
        <!--
          소셜 로그인도 돌아갈 주소를 함께 넘긴다.
          카카오·구글을 다녀오는 동안 원래 가려던 곳을 잊지 않기 위해서다.
        -->
        <p><a class="btn wide" style="display:block;text-align:center;text-decoration:none"
              th:href="@{/oauth/kakao(redirectUrl=${redirectUrl})}">카카오로 로그인</a></p>
        <p><a class="btn wide" style="display:block;text-align:center;text-decoration:none"
              th:href="@{/oauth/google(redirectUrl=${redirectUrl})}">구글로 로그인</a></p>
    </div>

    <p class="foot">
        아직 회원이 아니신가요?
        <a class="link" th:href="@{/signup}">이메일로 가입하기</a>
    </p>

    </div>
</div>

</body>
</html>
