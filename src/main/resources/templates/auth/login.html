<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인</title>
    <style>
        body { max-width: 360px; margin: 0 auto; padding: 24px 16px;
               font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
        label { display: block; margin-top: 12px; font-size: 14px; }
        input[type=email], input[type=password] {
            width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;
        }
        button { width: 100%; padding: 10px; margin-top: 16px; cursor: pointer; }
        .error { color: #c00; font-size: 14px; margin-top: 12px; }
        .social { margin-top: 20px; }
        .social a {
            display: block; padding: 10px; margin-top: 8px; text-align: center;
            border: 1px solid #ddd; border-radius: 4px; text-decoration: none; color: #333;
        }
        .sub { margin-top: 20px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

<h1>로그인</h1>

<p class="error" th:if="${error}" th:text="${error}">오류 메시지</p>

<form th:action="@{/login}" method="post">
    <!--
      로그인하지 않은 채로 가려던 주소를 그대로 들고 다닌다.
      화면에 보일 필요는 없으므로 hidden 으로 둔다.
    -->
    <input type="hidden" name="redirectUrl" th:value="${redirectUrl}">

    <label>이메일
        <!-- th:value 로 방금 입력한 값을 되살려, 실패했을 때 처음부터 다시 쓰지 않게 한다 -->
        <input type="email" name="email" th:value="${email}" required autofocus>
    </label>

    <label>비밀번호
        <!-- 비밀번호는 되살리지 않는다. 화면 소스에 남을 이유가 없다 -->
        <input type="password" name="password" required>
    </label>

    <button type="submit">로그인</button>
</form>

<div class="social">
    <!--
      소셜 로그인도 돌아갈 주소를 함께 넘긴다.
      카카오·구글을 다녀오는 동안 원래 가려던 곳을 잊지 않기 위해서다.
    -->
    <a th:href="@{/oauth/kakao(redirectUrl=${redirectUrl})}">카카오로 로그인</a>
    <a th:href="@{/oauth/google(redirectUrl=${redirectUrl})}">구글로 로그인</a>
</div>

<p class="sub">
    아직 회원이 아니신가요?
    <a th:href="@{/signup}">이메일로 가입하기</a>
</p>

</body>
</html>
