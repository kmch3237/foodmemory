<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>계정 설정</title>
    <style>
        body { max-width: 480px; margin: 0 auto; padding: 24px 16px;
               font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
        .msg { padding: 10px; border-radius: 6px; font-size: 14px; margin-bottom: 16px; }
        .ok { background: #f0f6f0; color: #2a6b2a; }
        .err { background: #fdf0f0; color: #a33; }
        ul { list-style: none; padding: 0; }
        li { padding: 12px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .when { color: #888; font-size: 12px; }
        .add a { display: block; padding: 10px; margin-top: 8px; text-align: center;
                 border: 1px solid #ddd; border-radius: 4px;
                 text-decoration: none; color: #333; font-size: 14px; }
        .note { color: #888; font-size: 12px; margin-top: 20px; line-height: 1.6; }
    </style>
</head>
<body>

<h1>계정 설정</h1>

<p>
    <strong th:text="${loginMember.nickname}">닉네임</strong> 님으로 로그인 중
</p>

<!-- 연결 결과를 알려준다. OAuthController 가 flash 로 담아 보낸다 -->
<div class="msg ok" th:if="${message}" th:text="${message}">안내</div>
<div class="msg err" th:if="${error}" th:text="${error}">오류</div>

<h2>연결된 로그인 수단</h2>

<ul>
    <li th:each="identity : ${identities}">
        <div th:text="${identity.description}">카카오 계정</div>
        <div class="when"
             th:text="${#temporals.format(identity.linkedAt, 'yyyy-MM-dd')} + ' 연결'">연결일</div>
    </li>
</ul>

<h2>계정 추가로 연결하기</h2>

<div class="add">
    <!--
      로그인 화면의 버튼과 주소가 같다.
      다만 지금은 로그인한 상태이므로, 돌아온 콜백을 서버가 '연결' 로 처리한다.
      로그인이냐 연결이냐를 주소로 나누지 않은 이유는, 그렇게 하면 로그인하지 않은
      사람이 연결용 주소를 직접 호출하는 경우를 따로 막아야 하기 때문이다.
      세션에 로그인 정보가 있느냐로 판단하면 그런 구멍이 생기지 않는다.
    -->
    <a th:href="@{/oauth/kakao}">카카오 계정 연결</a>
    <a th:href="@{/oauth/google}">구글 계정 연결</a>
</div>

<p class="note">
    연결하면 어느 계정으로 로그인해도 같은 사진첩이 보입니다.<br>
    이미 다른 회원이 쓰고 있는 계정은 연결할 수 없습니다.
</p>

<p><a th:href="@{/}">갤러리로 돌아가기</a></p>

</body>
</html>
