<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('계정 설정 · mealmate')}"></head>
<body>

<div class="sheet">

    <th:block th:replace="~{fragments/layout :: pageTop(${loginMember})}"></th:block>

    <div class="column">

    <p class="back"><a th:href="@{/}">← 내 갤러리</a></p>

    <p class="section">계정 설정</p>

    <!-- 연결 결과를 알려준다. OAuthController 가 flash 로 담아 보낸다 -->
    <div class="msg"     th:if="${message}" th:text="${message}">안내</div>
    <div class="msg err" th:if="${error}"   th:text="${error}">오류</div>

    <p class="section">연결된 로그인 수단</p>

    <ul class="list">
        <li th:each="identity : ${identities}">
            <div th:text="${identity.description}">카카오 계정</div>
            <div class="hint"
                 th:text="${#temporals.format(identity.linkedAt, 'yyyy-MM-dd')} + ' 연결'">연결일</div>
        </li>
    </ul>

    <div class="box sketch section-gap">
        <h2>계정 추가로 연결하기</h2>
        <!--
          로그인 화면의 버튼과 주소가 같다.
          다만 지금은 로그인한 상태이므로, 돌아온 콜백을 서버가 '연결' 로 처리한다.
          로그인이냐 연결이냐를 주소로 나누지 않은 이유는, 그렇게 하면 로그인하지 않은
          사람이 연결용 주소를 직접 호출하는 경우를 따로 막아야 하기 때문이다.
          세션에 로그인 정보가 있느냐로 판단하면 그런 구멍이 생기지 않는다.
        -->
        <p><a class="btn wide" style="display:block;text-align:center;text-decoration:none"
              th:href="@{/oauth/kakao}">카카오 계정 연결</a></p>
        <p><a class="btn wide" style="display:block;text-align:center;text-decoration:none"
              th:href="@{/oauth/google}">구글 계정 연결</a></p>

        <p class="hint">
            연결하면 어느 계정으로 로그인해도 같은 갤러리가 보입니다.<br>
            이미 다른 회원이 쓰고 있는 계정은 연결할 수 없습니다.
        </p>
    </div>

    </div>
</div>

</body>
</html>
