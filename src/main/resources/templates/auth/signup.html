<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('회원가입 · mealmate')}"></head>
<body>

<div class="sheet">

    <th:block th:replace="~{fragments/layout :: pageTop(null)}"></th:block>

    <div class="column">

    <p class="section">회원가입</p>

    <div class="msg err" th:if="${error}" th:text="${error}">오류 메시지</div>

    <form th:action="@{/signup}" method="post">

        <label class="field">
            <span>이메일</span>
            <input type="email" name="email" th:value="${email}" required autofocus>
        </label>

        <label class="field">
            <span>비밀번호</span>
            <!--
              minlength 는 브라우저가 보내기 전에 걸러주는 편의 기능일 뿐이다.
              개발자 도구로 지우거나 curl 로 직접 보내면 그냥 통과한다.
              진짜 검사는 서버(AuthServiceImpl)에서 한 번 더 한다.
            -->
            <input type="password" name="password" minlength="8" required>
            <span class="hint">8자 이상</span>
        </label>

        <label class="field">
            <span>닉네임</span>
            <input type="text" name="nickname" th:value="${nickname}" maxlength="50" required>
            <span class="hint">갤러리에 표시되는 이름입니다</span>
        </label>

        <!--
          소셜 가입과 같은 약관 동의를 받는다. 가입 경로가 달라도 동의는 똑같이 필요하다.

          '보기' 는 새 탭으로 연다. 같은 탭에서 열면 여기까지 쓴 입력값이 사라진다.
          label 안의 링크를 눌러도 체크박스는 바뀌지 않는다.
          label 은 안에 든 링크·버튼 같은 '원래 누를 수 있는 것' 에는 클릭을 넘기지 않는다.
        -->
        <div class="box sketch">
            <label>
                <input type="checkbox" name="agreeTerms" value="true" required>
                <strong>[필수]</strong> 이용약관에 동의합니다
                <a class="link agree-view" th:href="@{/terms}" target="_blank" rel="noopener">보기</a>
            </label>
            <label>
                <input type="checkbox" name="agreePrivacy" value="true" required>
                <strong>[필수]</strong> 개인정보 처리방침에 동의합니다
                <a class="link agree-view" th:href="@{/privacy}" target="_blank" rel="noopener">보기</a>
            </label>
        </div>

        <button type="submit" class="btn wide">동의하고 가입하기</button>
    </form>

    <p class="foot">
        이미 회원이신가요?
        <a class="link" th:href="@{/login}">로그인</a>
    </p>

    </div>
</div>

</body>
</html>
