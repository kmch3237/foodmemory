<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  모든 화면이 함께 쓰는 조각.

  글꼴 링크와 스타일시트를 화면마다 복사해두면, 나중에 하나를 바꿀 때
  전부 찾아 고쳐야 하고 한 곳만 빠뜨리면 그 화면만 다르게 보인다.
  한 군데에 모아두고 끌어다 쓴다.
-->
<head>

<!--
  head 안에 들어갈 것들. title 은 화면마다 다르므로 파라미터로 받는다.

  조각 이름을 'head' 가 아니라 'pageHead' 로 둔 이유:
    Thymeleaf 는 :: 뒤의 이름을 조각 이름으로도, HTML 태그 선택자로도 해석할 수 있다.
    'head' 라고 쓰면 <head> 태그를 고르는 것으로 먼저 읽혀서,
    파라미터를 넘길 수 없다는 오류가 난다. 태그 이름과 겹치지 않게 짓는다.
-->
<th:block th:fragment="pageHead(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">mealmate</title>

    <!--
      한글 손글씨체.
      Excalifont 에는 한글이 없어서, 브라우저가 없는 글자를 만나면 이쪽으로 넘어간다.
      preconnect 는 "곧 이 서버에 붙을 거야" 라고 미리 알려 연결 시간을 줄인다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">

    <!--
      ── 앱처럼 쓰기 위한 설정 (PWA) ──────────────────────────

      manifest 는 브라우저에게 "이건 그냥 웹이 아니라 앱으로 취급해도 된다"
      고 알려주는 명세서다. 앱 이름, 아이콘, 시작 주소가 들어 있다.
      이게 있어야 '홈 화면에 추가' 가 아이콘 있는 앱 형태로 설치된다.
    -->
    <link rel="manifest" th:href="@{/manifest.webmanifest}">

    <!-- 주소창과 상태바 색. 흰 종이 느낌을 화면 끝까지 이어준다 -->
    <meta name="theme-color" content="#ffffff">

    <!--
      아이폰은 manifest 를 제대로 안 읽는다. 애플이 따로 만든 규칙을 쓴다.
      그래서 같은 내용을 apple- 로 시작하는 태그로 한 번 더 적어준다.
    -->
    <link rel="apple-touch-icon" th:href="@{/icons/apple-touch-icon.png}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="mealmate">

    <!--
      서비스 워커 등록.
      브라우저는 요청을 가로챌 수 있는 이 프로그램이 등록돼 있어야
      "설치 가능한 앱" 으로 인정한다. 없으면 설치 버튼이 안 뜬다.

      실패해도 무시한다. 서비스 워커가 없다고 사이트가 안 돌아갈 이유는 없다.
    -->
    <script th:inline="javascript">
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js').catch(function () {});
            });
        }
    </script>
</th:block>

</head>
<body>

<!--
  로고와 사용자 이름이 있는 머리말.

  loginMember 가 null 이면 이름 자리를 비운다.
  로그인·가입 화면에서도 같은 머리말을 쓰기 위해서다.
-->
<th:block th:fragment="pageTop(loginMember)">
    <div class="head">
        <a class="logo sketch" th:href="@{/}">mealmate</a>

        <span class="who" th:if="${loginMember != null}">
            <span th:text="${loginMember.nickname} + '님'">닉네임</span>
            <!-- 로그아웃은 서버 상태를 바꾸므로 링크가 아니라 폼(POST)이다 -->
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button type="submit" class="btn">로그아웃</button>
            </form>
        </span>
    </div>

    <div class="rule"></div>
</th:block>


<!--
  ── 촬영 버튼 ──────────────────────────────────────────
  화면 아래 가운데에 떠 있는 동그란 버튼.

  머리말(pageTop)에서 떼어내 따로 둔 이유:
    이 버튼은 갤러리에서만 의미가 있다.
    글을 쓰거나 고치는 중에, 또는 장소를 고르는 중에 이것을 누르면
    하던 일이 그대로 날아가고 엉뚱하게 새 기록이 만들어진다.
    머리말은 모든 화면이 함께 쓰는 것이지만 이 버튼은 그렇지 않다.
    한데 묶어두면 '모든 화면에 딸려 나온다' 는 사실이 눈에 띄지 않는다.
    쓸 화면에서 직접 불러 쓰게 해두면 어디에 있는지가 코드에 드러난다.

  누르면 폰의 기본 카메라가 열리고, 찍으면 곧바로 올라간다.
  코멘트나 장소를 고르는 단계를 건너뛰는 것이 핵심이다.
  먹기 직전에 한 손으로 찍는 상황을 위한 길이라,
  중간에 화면이 하나라도 끼면 그 자리에서 안 쓰게 된다.

  코멘트와 장소는 올린 뒤에 붙일 수 있다.
  그래서 올리자마자 그 기록의 상세 화면으로 보낸다.

  input 을 숨기고 label 을 버튼처럼 쓰는 것은 업로드 폼과 같은 이유다.
  파일 선택칸은 브라우저마다 생김새가 달라 꾸밀 수 없다.
-->
<th:block th:fragment="shotButton(loginMember, spaceId)">
    <div th:if="${loginMember != null}" class="shot-form">

        <!--
          찍은 사진이 어디로 갈지는 '어느 화면에서 눌렀는가' 로 정한다.

            메인에서 누름  → spaceId 없음 → 내 갤러리에 개인 기록으로
            방에서 누름    → spaceId 있음 → 그 방에

          찍고 나서 방을 고르게 하지 않는 이유는 그대로다.
          지금 보고 있는 화면이 곧 사용자의 의도라고 본다.
        -->
        <label class="shot" th:title="${spaceId != null}
                   ? '이 방에 사진 찍어 올리기' : '내 갤러리에 사진 찍어 올리기'">
            <!--
              environment = 뒷카메라.

              찍자마자 바로 올리지 않는 이유:
                한동안은 고르는 순간 그대로 전송했다. 한 손으로 빠르게 쓰라는 뜻이었는데,
                찍고 나서야 흔들린 것을 알아도 되돌릴 수 없었고 코멘트도 붙일 수 없었다.
                이제는 방금 찍은 사진을 들고 '기록 올리기' 폼으로 넘어간다.
                거기서 눈으로 확인하고, 코멘트와 날짜를 붙인 뒤 올린다.

              사진을 들고 가는 방법은 shot-handoff.js 주석에 적어두었다.
              파일 입력칸의 내용은 페이지를 넘어가면 비워지기 때문에 그냥은 못 넘긴다.
            -->
            <input type="file" name="photos" accept="image/*" capture="environment" hidden
                   th:attr="data-space-id=${spaceId}"
                   onchange="handOffShot(this);">
            <span class="shot-text">촬영</span>
        </label>
    </div>

    <script th:src="@{/js/shot-handoff.js}"></script>
    <script>
        /*
          찍은 사진을 맡겨두고 '기록 올리기' 폼으로 넘어간다.

          맡기는 데 실패해도 폼으로는 넘어간다.
          사진 없이 열리더라도 거기서 '지금 찍기' 를 한 번 더 누르면 되고,
          아무 일도 일어나지 않는 것보다는 낫다.
        */
        function handOffShot(input) {
            if (input.files.length === 0) {
                return;   // 카메라를 열었다가 취소한 경우
            }

            // 넘어가는 동안 버튼을 흐리게 두어 두 번 눌리지 않게 한다
            input.closest('.shot-form').classList.add('sending');

            var spaceId = input.dataset.spaceId;
            var url = '/posts/new?shot=1' + (spaceId ? '&spaceId=' + spaceId : '');

            ShotHandoff.save(input.files).then(function () {
                location.href = url;
            });
        }
    </script>
</th:block>

</body>
</html>
