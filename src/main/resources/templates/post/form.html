<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('기록 올리기 · mealmate')}"></head>
<body>

<div class="sheet">

    <th:block th:replace="~{fragments/layout :: pageTop(${loginMember})}"></th:block>

    <div class="column">

    <p class="back"><a th:href="@{/}">← 내 갤러리</a></p>

    <p class="section">기록 올리기</p>

    <!-- 등록에 실패했을 때 이유를 보여준다 -->
    <div class="msg err" th:if="${error}" th:text="${error}">오류 메시지</div>

    <!--
      enctype="multipart/form-data" 가 반드시 있어야 한다.
      이게 없으면 파일 내용은 서버로 전송되지 않고 파일 이름만 문자열로 넘어간다.
      파일 업로드가 안 될 때 가장 먼저 확인하는 부분이다.

      method="post" 인 이유는 서버의 상태를 바꾸는 요청이기 때문이다.
      조회는 GET, 등록·수정·삭제는 POST 로 구분한다.
    -->
    <form th:action="@{/posts}" method="post" enctype="multipart/form-data">

        <div class="field">
            <span>사진</span>

            <!--
              입구를 둘로 나눈다.

              capture 를 붙이면 파일 선택 창 대신 카메라가 바로 열린다.
              그런데 붙이는 순간 갤러리를 고를 수 없게 된다.
              이 서비스는 '갤러리에 쌓인 사진을 모아두는 것' 에서 출발했으므로
              그 길을 막으면 안 된다. 그래서 둘 다 둔다.

              두 입력칸의 name 이 똑같이 photos 인 것은 의도한 것이다.
              서버는 List 로 받고 비어 있는 것은 건너뛰므로,
              어느 쪽으로 골랐든 같은 자리로 들어온다.

              required 를 빼둔 이유:
                두 칸 중 하나만 쓰는데 양쪽에 required 를 걸면 저장이 막힌다.
                '사진 한 장 이상' 검사는 어차피 서버가 한다.
            -->
            <div class="pick-row">
                <label class="btn pick">
                    갤러리에서 고르기
                    <input type="file" name="photos" accept="image/*" multiple hidden>
                </label>

                <label class="btn pick">
                    지금 찍기
                    <!-- environment = 뒷카메라. user 로 하면 셀카가 열린다 -->
                    <input type="file" name="photos" accept="image/*" capture="environment" hidden>
                </label>
            </div>

            <!-- 고른 결과를 보여주지 않으면 눌렀는지 아닌지 알 수 없다 -->
            <span class="hint" id="picked">아직 고르지 않았습니다.</span>
        </div>

        <label class="field">
            <span>어디에 올릴까요?</span>
            <!--
              내가 참여 중인 방만 목록에 나온다.
              다만 이 목록만 믿지 않는다. 개발자 도구로 값을 남의 방 번호로 바꿔 보낼 수 있어서,
              서버가 저장 직전에 그 방의 참여자인지 다시 확인한다.
            -->
            <select name="spaceId">
                <option value="">나만 보기 (개인 기록)</option>
                <option th:each="space : ${spaces}"
                        th:value="${space.spaceId}"
                        th:text="${space.name}">방 이름</option>
            </select>
        </label>

        <label class="field">
            <span>먹은 날짜</span>
            <!-- datetime-local 은 날짜와 시각을 함께 입력받는다 -->
            <input type="datetime-local" name="eatenDate">
            <span class="hint">비워두면 사진의 촬영 시각을 사용합니다.</span>
        </label>

        <label class="field">
            <span>코멘트 (선택)</span>
            <!-- 코멘트는 필수가 아니다. 사진만으로도 완결된 기록이다 -->
            <textarea name="content" rows="3" maxlength="500"></textarea>
        </label>

        <button type="submit" class="btn wide">올리기</button>
    </form>

    <script>
        // 파일을 고르면 몇 장 골랐는지 알려준다.
        // 숨긴 입력칸이라 화면에 파일명이 안 나와서, 이게 없으면 눌렀는지 알 수 없다.
        document.querySelectorAll('.pick input[type=file]').forEach(function (input) {
            input.addEventListener('change', function () {
                var n = input.files.length;
                document.getElementById('picked').textContent =
                    n === 0 ? '아직 고르지 않았습니다.' : '사진 ' + n + '장을 골랐습니다.';
            });
        });
    </script>

    </div>
</div>

</body>
</html>
