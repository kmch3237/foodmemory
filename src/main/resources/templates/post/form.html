<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('기록 올리기 · mealmate')}"></head>
<body>

<div class="sheet">

    <th:block th:replace="~{fragments/layout :: pageTop(${loginMember})}"></th:block>

    <div class="column">

    <p class="back"><a th:href="@{/}">← 내 갤러리</a></p>

    <p class="section">기록 올리기</p>

    <!-- 등록에 실패했을 때 이유를 보여준다 -->
    <div class="msg err" th:if="${error}" th:text="${error}">오류 메시지</div>

    <!--
      enctype="multipart/form-data" 가 반드시 있어야 한다.
      이게 없으면 파일 내용은 서버로 전송되지 않고 파일 이름만 문자열로 넘어간다.
      파일 업로드가 안 될 때 가장 먼저 확인하는 부분이다.

      method="post" 인 이유는 서버의 상태를 바꾸는 요청이기 때문이다.
      조회는 GET, 등록·수정·삭제는 POST 로 구분한다.
    -->
    <form th:action="@{/posts}" method="post" enctype="multipart/form-data">

        <div class="field">
            <span>사진</span>

            <!--
              입구를 둘로 나눈다.

              capture 를 붙이면 파일 선택 창 대신 카메라가 바로 열린다.
              그런데 붙이는 순간 갤러리를 고를 수 없게 된다.
              이 서비스는 '갤러리에 쌓인 사진을 모아두는 것' 에서 출발했으므로
              그 길을 막으면 안 된다. 그래서 둘 다 둔다.

              두 입력칸의 name 이 똑같이 photos 인 것은 의도한 것이다.
              서버는 List 로 받고 비어 있는 것은 건너뛰므로,
              어느 쪽으로 골랐든 같은 자리로 들어온다.

              required 를 빼둔 이유:
                두 칸 중 하나만 쓰는데 양쪽에 required 를 걸면 저장이 막힌다.
                '사진 한 장 이상' 검사는 어차피 서버가 한다.
            -->
            <div class="pick-row">
                <label class="btn pick">
                    갤러리에서 고르기
                    <input type="file" name="photos" accept="image/*" multiple hidden>
                </label>

                <label class="btn pick">
                    지금 찍기
                    <!-- environment = 뒷카메라. user 로 하면 셀카가 열린다 -->
                    <input type="file" name="photos" accept="image/*" capture="environment" hidden>
                </label>
            </div>

            <!-- 고른 결과를 보여주지 않으면 눌렀는지 아닌지 알 수 없다 -->
            <span class="hint" id="picked">아직 고르지 않았습니다.</span>

            <!--
              고른 사진을 그 자리에서 보여준다.

              장수만 알려주던 때의 문제:
                '사진 3장을 골랐습니다' 만으로는 어떤 사진인지 알 수 없다.
                갤러리에서 손가락으로 급히 고르면 엉뚱한 것이 딸려 들어오기 쉬운데,
                올리고 상세 화면에 들어가야 그걸 알게 된다.
                올리기 전에 눈으로 확인할 수 있어야 한다.

              서버에 올리지 않고도 보여줄 수 있다.
              브라우저가 이미 그 파일을 손에 들고 있으므로, 거기에 임시 주소를
              붙여(URL.createObjectURL) img 에 넣으면 된다. 네트워크를 타지 않아 즉시 뜬다.
            -->
            <div class="pick-preview" id="preview"></div>
        </div>

        <label class="field">
            <span>어디에 올릴까요?</span>
            <!--
              내가 참여 중인 방만 목록에 나온다.
              다만 이 목록만 믿지 않는다. 개발자 도구로 값을 남의 방 번호로 바꿔 보낼 수 있어서,
              서버가 저장 직전에 그 방의 참여자인지 다시 확인한다.
            -->
            <select name="spaceId">
                <option value="">나만 보기 (개인 기록)</option>
                <option th:each="space : ${spaces}"
                        th:value="${space.spaceId}"
                        th:text="${space.name}">방 이름</option>
            </select>
        </label>

        <label class="field">
            <span>먹은 날짜</span>
            <!-- datetime-local 은 날짜와 시각을 함께 입력받는다 -->
            <input type="datetime-local" name="eatenDate">
            <span class="hint">비워두면 사진의 촬영 시각을 사용합니다.</span>
        </label>

        <label class="field">
            <span>코멘트 (선택)</span>
            <!-- 코멘트는 필수가 아니다. 사진만으로도 완결된 기록이다 -->
            <textarea name="content" rows="3" maxlength="500"></textarea>
        </label>

        <button type="submit" class="btn wide">올리기</button>
    </form>

    <script>
        /*
          고른 사진을 장수와 썸네일로 보여준다.

          입력칸 두 개를 함께 세는 이유:
            '갤러리에서 고르기' 와 '지금 찍기' 는 name 이 둘 다 photos 라
            어느 쪽으로 골랐든 함께 올라간다. 그런데 방금 바뀐 칸만 세면,
            갤러리에서 두 장 고른 뒤 한 장을 더 찍었을 때 '1장' 이라고 나온다.
            실제로 올라가는 것은 세 장이다. 화면이 사실과 달라지면 안 된다.
        */
        (function () {
            var inputs  = document.querySelectorAll('.pick input[type=file]');
            var picked  = document.getElementById('picked');
            var preview = document.getElementById('preview');

            /*
              만들어둔 임시 주소를 적어둔다.

              createObjectURL 로 만든 주소는 브라우저가 그 파일을 메모리에 붙잡고 있게 한다.
              다시 고를 때마다 새로 만들기만 하고 반납하지 않으면, 사진을 고를수록
              메모리가 계속 쌓인다. 사진 한 장이 수 MB 라 금방 커진다.
            */
            var urls = [];

            function render() {
                urls.forEach(URL.revokeObjectURL);
                urls = [];
                preview.replaceChildren();

                var files = [];
                inputs.forEach(function (input) {
                    files.push.apply(files, input.files);
                });

                picked.textContent = files.length === 0
                    ? '아직 고르지 않았습니다.'
                    : '사진 ' + files.length + '장을 골랐습니다.';

                files.forEach(function (file) {
                    var url = URL.createObjectURL(file);
                    urls.push(url);

                    var img = document.createElement('img');
                    img.src = url;
                    img.alt = file.name;

                    /*
                      아이폰이 찍은 HEIC 처럼 브라우저가 그리지 못하는 형식이 있다.
                      그때 깨진 이미지 아이콘만 남으면 고장난 것처럼 보이므로,
                      파일 이름을 대신 보여준다. 올리는 데는 문제가 없다.
                    */
                    img.onerror = function () {
                        var box = document.createElement('span');
                        box.className = 'pick-noimg';
                        box.textContent = file.name;
                        img.replaceWith(box);
                    };

                    preview.appendChild(img);
                });
            }

            inputs.forEach(function (input) {
                input.addEventListener('change', render);
            });
        })();
    </script>

    </div>
</div>

</body>
</html>
