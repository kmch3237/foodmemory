<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('기록 상세 · mealmate')}"></head>
<body>

<div class="sheet">

    <th:block th:replace="~{fragments/layout :: pageTop(${loginMember})}"></th:block>

    <p class="back">
        <a th:if="${post.spaceId == null}" th:href="@{/}">← 내 갤러리</a>
        <a th:if="${post.spaceId != null}"
           th:href="@{/spaces/{id}(id=${post.spaceId})}"
           th:text="'← ' + ${post.spaceName}">← 방</a>
    </p>

    <!--
      왼쪽은 사진과 기록, 오른쪽은 댓글이다.
      사진을 보면서 그 옆의 대화를 함께 읽게 하는 배치다.
      화면이 좁아지면 CSS 가 위아래 한 줄로 되돌린다.
    -->
    <div class="detail">

        <!-- ── 왼쪽: 사진과 기록 ──────────────────────────── -->
        <div class="detail-main">

            <!--
              사진을 한 장씩 옆으로 넘겨 본다.

              예전에는 사진을 세로로 쭉 늘어놓았다. 그러면 사진이 다섯 장일 때
              왼쪽만 한없이 길어지고 옆의 댓글 칸은 위에 붙은 채로 남아
              둘이 나란히 있다는 느낌이 사라진다.

              사진마다 원본 비율이 제각각이라 틀을 정사각으로 고정하고
              넘치는 부분만 잘라낸다. 늘리면 음식이 찌그러진다.
            -->
            <div class="photo-frame" th:if="${!#lists.isEmpty(post.photoPaths)}">
                <div class="photo-track">
                    <img th:each="path, i : ${post.photoPaths}"
                         th:id="'photo-' + ${i.index}"
                         th:src="@{${uploadUrlPrefix} + '/' + ${path}}" alt="음식 사진">
                </div>
            </div>

            <!--
              사진이 두 장 이상일 때만 점을 보여준다. 한 장이면 넘길 곳이 없다.
              점은 링크라서 누르면 그 사진 자리로 넘어간다. 자바스크립트가 필요 없다.
            -->
            <div class="dots" th:if="${#lists.size(post.photoPaths) > 1}">
                <a th:each="path, i : ${post.photoPaths}"
                   th:href="'#photo-' + ${i.index}"
                   th:title="${i.index + 1} + '번째 사진'"></a>
            </div>

            <p class="empty" th:if="${#lists.isEmpty(post.photoPaths)}">사진이 없습니다.</p>

            <p>
                <strong th:text="${post.writerNickname}">닉네임</strong>
                <span th:text="${#temporals.format(post.eatenDate, 'yyyy년 M월 d일 HH:mm')}">날짜</span>
            </p>

            <!-- 코멘트는 없을 수 있다. 사진만으로도 완결된 기록이다 -->
            <p th:if="${!#strings.isEmpty(post.content)}" th:text="${post.content}">코멘트</p>

            <!--
              이 기록이 어디까지 보이는지 알려준다.
              공개 범위는 사용자가 늘 확인할 수 있어야 하는 정보다.
            -->
            <p class="hint" th:if="${post.spaceId != null}">
                <span th:text="${post.spaceName}">방 이름</span> 에 올린 기록입니다. 멤버 모두가 볼 수 있습니다.
            </p>
            <p class="hint" th:if="${post.spaceId == null}">나만 보는 개인 기록입니다.</p>

            <!-- 장소도 없을 수 있다. 집에서 먹었거나 아직 연결하지 않은 경우다 -->
            <div class="box sketch" th:if="${post.placeName != null}">
                <strong th:text="${post.placeName}">장소 이름</strong>
                <div class="hint" th:text="${post.placeAddress}">주소</div>
            </div>

            <!--
              본인 기록에서만 보여준다.

              예전에는 장소가 없을 때만(placeName == null) 이 버튼이 나왔다.
              그래서 장소를 한 번 잘못 고르면 되돌릴 방법이 없었다.
              이제 문구만 상황에 맞게 바꾸고 버튼은 항상 둔다.
            -->
            <p th:if="${loginMember != null and loginMember.memberId == post.writerId}">
                <a class="btn" th:href="@{/posts/{id}/places(id=${post.postId})}"
                   th:text="${post.placeName == null} ? '장소 연결하기' : '장소 바꾸기'">장소 연결하기</a>
            </p>

            <!--
              수정·삭제 버튼은 본인 기록에만 보인다.
              다만 버튼을 감추는 것은 편의일 뿐이고, 실제 차단은 서버가 한다.
              버튼이 없어도 주소로 직접 요청을 보낼 수 있기 때문이다.

              수정은 링크(GET)이고 삭제는 form(POST)이다.
              화면을 보여주기만 하는 것은 GET, 서버의 상태를 바꾸는 것은 POST 로 나눈다.
              삭제를 링크로 두면 브라우저의 미리 불러오기나 크롤러가 지나가며 글을 지울 수 있다.
            -->
            <div th:if="${loginMember != null and loginMember.memberId == post.writerId}"
                 class="comment-tools section-gap">

                <a class="btn" th:href="@{/posts/{id}/edit(id=${post.postId})}">기록 수정</a>

                <!-- 한 번 더 묻는 이유: 삭제는 되돌릴 수 없다. -->
                <form th:action="@{/posts/{id}/delete(id=${post.postId})}"
                      method="post"
                      onsubmit="return confirm('이 기록을 삭제할까요? 사진도 함께 지워지며 되돌릴 수 없습니다.');">
                    <button type="submit" class="btn">기록 삭제</button>
                </form>

            </div>

        </div>

        <!-- ── 오른쪽: 댓글 ───────────────────────────────── -->
        <div class="detail-side">

            <p class="section">
                댓글
                <span class="hint" th:text="'(' + ${comments.totalCount} + ')'">(0)</span>
            </p>

            <!-- 등록에 실패했을 때 이유를 보여준다. 비어 있거나 너무 긴 경우다 -->
            <div class="msg err" th:if="${commentError}" th:text="${commentError}">오류 메시지</div>

            <!--
              댓글 목록만 따로 감싼 이유:
              이 칸만 늘어나고 줄어들게 해야, 댓글이 많아져도 아래의 입력칸이
              화면 밖으로 밀려나지 않는다. 넘치면 목록 안에서 스크롤된다.
            -->
            <div class="comment-list">

            <p class="empty" th:if="${comments.empty}">아직 댓글이 없습니다.</p>

            <div th:each="comment : ${comments.comments}" class="comment">

                <p>
                    <strong th:text="${comment.writerNickname}">닉네임</strong>
                    <span class="hint"
                          th:text="${#temporals.format(comment.createdAt, 'yyyy.M.d HH:mm')}">시각</span>
                    <!--
                      고쳐진 적이 있으면 알려준다.
                      사람의 말이 소리 없이 바뀌면 읽는 쪽이 자기 기억을 의심하게 된다.
                    -->
                    <span class="hint" th:if="${comment.edited}">(수정됨)</span>
                </p>

                <p th:text="${comment.content}">댓글 내용</p>

                <!--
                  수정은 쓴 사람만, 삭제는 쓴 사람과 기록 주인이 할 수 있다.
                  여기서 버튼을 감추는 것은 편의일 뿐이고 실제 차단은 서버가 한다.
                -->
                <div class="comment-tools"
                     th:if="${loginMember != null and
                             (loginMember.memberId == comment.writerId
                              or loginMember.memberId == post.writerId)}">

                    <!--
                      수정 폼을 처음부터 감춰둔 채로 함께 내려보낸다.
                      details 태그는 브라우저가 기본으로 접었다 펴주는 기능이라
                      자바스크립트 없이도 '수정' 을 눌렀을 때만 입력칸이 나타나게 할 수 있다.
                    -->
                    <details th:if="${loginMember.memberId == comment.writerId}">
                        <summary>수정</summary>
                        <form class="comment-edit"
                              th:action="@{/posts/{postId}/comments/{commentId}/edit
                                           (postId=${post.postId}, commentId=${comment.commentId})}"
                              method="post">
                            <!--
                              지금 보고 있는 쪽 번호를 함께 보낸다.
                              이게 없으면 3쪽에서 고친 뒤 1쪽으로 돌아가 버린다.
                              화면에 보일 필요가 없는 값이라 hidden 으로 숨겨 나른다.
                            -->
                            <input type="hidden" name="commentPage" th:value="${comments.page}">
                            <textarea name="content" rows="2" maxlength="300"
                                      th:text="${comment.content}"></textarea>
                            <button type="submit" class="btn">저장</button>
                        </form>
                    </details>

                    <form th:action="@{/posts/{postId}/comments/{commentId}/delete
                                       (postId=${post.postId}, commentId=${comment.commentId})}"
                          method="post"
                          onsubmit="return confirm('이 댓글을 지울까요?');">
                        <input type="hidden" name="commentPage" th:value="${comments.page}">
                        <button type="submit" class="btn">삭제</button>
                    </form>

                </div>

            </div>

            </div><!-- /comment-list -->

            <!--
              쪽 이동.

              댓글이 한 쪽에 다 들어가면 아예 보여주지 않는다.
              누를 수 없는 버튼을 남겨두면 자리만 차지하고 사용자를 헷갈리게 한다.

              이동을 링크(GET)로 두는 이유:
                쪽을 넘기는 것은 화면을 보여주기만 할 뿐 아무것도 바꾸지 않는다.
                그래서 form 이 아니라 링크가 맞고, 그 쪽 주소를 그대로 공유할 수도 있다.
            -->
            <div class="pager" th:if="${comments.totalPages > 1}">

                <a th:if="${comments.hasPrev()}"
                   th:href="@{/posts/{id}(id=${post.postId}, commentPage=${comments.page - 1})}">← 이전</a>
                <span th:unless="${comments.hasPrev()}"></span>

                <span class="hint"
                      th:text="${comments.displayPage()} + ' / ' + ${comments.totalPages}">1 / 3</span>

                <a th:if="${comments.hasNext()}"
                   th:href="@{/posts/{id}(id=${post.postId}, commentPage=${comments.page + 1})}">다음 →</a>
                <span th:unless="${comments.hasNext()}"></span>

            </div>

            <!--
              댓글 작성 폼.
              이 화면을 볼 수 있다는 것은 이 기록에 접근할 수 있다는 뜻이므로 누구에게나 보여준다.
              개인 기록이면 어차피 작성자 본인만 여기까지 들어온다.
            -->
            <form th:if="${loginMember != null}"
                  class="comment-form"
                  th:action="@{/posts/{id}/comments(id=${post.postId})}"
                  method="post">
                <!--
                  label 로 감싸지 않고 입력칸과 버튼을 나란히 둔다.
                  둘을 한 줄에 놓아야 목록이 쓸 수 있는 세로 자리가 남는다.

                  maxlength 는 브라우저가 지키는 약속일 뿐이다. 요청을 직접 만들면 무시된다.
                  그래서 서버(CommentServiceImpl)에서 같은 길이를 한 번 더 검사한다.
                -->
                <textarea name="content" rows="1" maxlength="300"
                          placeholder="댓글 달기..."></textarea>
                <button type="submit" class="btn">등록</button>
            </form>

        </div>

    </div>

</div>

</body>
</html>
