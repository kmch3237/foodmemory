<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>식당 선택</title>
    <style>
        body { max-width: 640px; margin: 0 auto; padding: 16px;
               font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
        li { margin-bottom: 12px; }
        .meta { color: #666; font-size: 13px; }
    </style>
</head>
<body>

<h1>어디서 드셨나요?</h1>
<p class="meta">사진에 기록된 위치 주변의 음식점입니다. 가까운 순서로 보여줍니다.</p>

<p th:if="${#lists.isEmpty(places)}">주변에서 음식점을 찾지 못했습니다.</p>

<ul>
    <li th:each="place : ${places}">
        <!--
          장소마다 폼을 하나씩 둔다.
          선택은 서버의 데이터를 바꾸는 동작이므로 링크(GET)가 아니라 POST 로 보낸다.
        -->
        <form th:action="@{/posts/{id}/restaurant(id=${postId})}" method="post">
            <input type="hidden" name="placeId" th:value="${place.placeId}">
            <button type="submit" th:text="${place.name}">가게 이름</button>
            <div class="meta">
                <span th:text="${place.distanceMeters} + 'm'">거리</span>
                <span th:text="${place.address}">주소</span>
                <span th:text="${place.categoryName}">분류</span>
            </div>
        </form>
    </li>
</ul>

<p><a th:href="@{/posts/{id}(id=${postId})}">돌아가기</a></p>

</body>
</html>
