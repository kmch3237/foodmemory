<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  무한 스크롤.

  내 갤러리와 방 갤러리가 똑같이 동작하므로 조각으로 뺐다.
  다른 것은 어느 목록을 이어붙이느냐뿐이고, 그건 spaceId 하나로 갈린다.

  spaceId 가 null 이면 내 갤러리, 값이 있으면 그 방의 갤러리를 가져온다.
-->
<script th:fragment="script(spaceId)" th:inline="javascript">
    (function () {
        const sentinel = document.getElementById('sentinel');
        if (!sentinel) {
            return;   // 다음 페이지가 없으면 할 일이 없다
        }

        const gallery = document.getElementById('gallery');
        const loading = document.getElementById('loading');

        const spaceId = /*[[${spaceId}]]*/ null;
        const query = spaceId == null ? '' : '&spaceId=' + spaceId;

        let nextPage = Number(sentinel.dataset.nextPage);

        // 요청을 보내는 중인지 표시한다.
        // 이게 없으면 스크롤이 걸쳐 있는 동안 같은 페이지를 여러 번 요청해 사진이 중복된다.
        let loadingNow = false;

        async function loadNext() {
            if (loadingNow) {
                return;
            }
            loadingNow = true;
            loading.hidden = false;

            try {
                const res = await fetch('/posts/more?page=' + nextPage + query);
                if (!res.ok) {
                    throw new Error('HTTP ' + res.status);
                }

                // 받은 것은 사진 칸 HTML 조각이다. 격자 끝에 그대로 덧붙인다.
                gallery.insertAdjacentHTML('beforeend', await res.text());

                // 다음이 남았는지는 본문이 아니라 헤더가 알려준다
                if (res.headers.get('X-Has-Next') === 'true') {
                    nextPage += 1;
                } else {
                    // 더 없으면 감시를 멈추고 칸을 치운다. 안 그러면 계속 요청한다
                    observer.disconnect();
                    sentinel.remove();
                }
            } catch (e) {
                // 실패했다고 감시를 끊지는 않는다. 잠시 끊긴 것일 수 있으므로
                // 다시 스크롤하면 재시도된다.
                console.error('다음 페이지를 불러오지 못했습니다.', e);
            } finally {
                loadingNow = false;
                loading.hidden = true;
            }
        }

        /*
          IntersectionObserver 는 "이 요소가 화면에 보이는가" 를 브라우저가 알려주는 기능이다.

          scroll 이벤트로 직접 계산하지 않는 이유:
            scroll 은 스크롤하는 내내 수십 번씩 발생해서 그때마다 위치를 계산해야 한다.
            IntersectionObserver 는 보이기 시작하는 순간에만 한 번 알려주므로 훨씬 가볍다.

          rootMargin 은 감시 범위를 넓힌다. 400px 을 주면 감시 칸이 화면에
          닿기 400px 전에 미리 불러와서, 사용자가 빈 화면을 보지 않는다.
        */
        const observer = new IntersectionObserver(function (entries) {
            if (entries[0].isIntersecting) {
                loadNext();
            }
        }, { rootMargin: '400px' });

        observer.observe(sentinel);
    })();
</script>

</body>
</html>
