<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  갤러리의 사진 칸들.

  이 파일은 통째로 열리는 화면이 아니라 조각이다.
  첫 화면도 이 조각을 쓰고, 스크롤로 이어붙이는 요청도 이 조각을 쓴다.
  한 군데만 고치면 양쪽이 같이 바뀐다.

  별도 파일로 뺀 이유:
    같은 파일 안에 조각을 두고 그 자리에서 다시 불러오면 자기 자신을 무한히 부르게 된다.
-->
<body>

<th:block th:fragment="cards">
    <a class="card" th:each="post : ${posts}" th:href="@{/posts/{id}(id=${post.postId})}">

        <!--
          loading="lazy" 는 화면에 들어올 때가 되어서야 사진을 내려받게 한다.
          무한 스크롤은 사진이 계속 쌓이는 구조라, 이게 없으면 아직 보이지도 않는
          사진까지 전부 받느라 느려진다.
        -->
        <img th:if="${post.thumbnailPath != null}"
             loading="lazy"
             th:src="@{${uploadUrlPrefix} + '/' + ${post.thumbnailPath}}"
             th:alt="${#temporals.format(post.eatenDate, 'yyyy-MM-dd')} + ' 기록'">

        <div th:if="${post.thumbnailPath == null}" class="no-photo">사진 없음</div>
    </a>
</th:block>

</body>
</html>
