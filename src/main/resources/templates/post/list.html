<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('mealmate')}"></head>
<body>

<div class="sheet">

    <th:block th:replace="~{fragments/layout :: pageTop(${loginMember})}"></th:block>

    <!-- ── 참여 중인 방 ───────────────────────────────────── -->
    <!--
      방을 첫 화면에 펼쳐둔다.
      링크 하나로 두면 존재를 잊는다. 함께 쓰는 공간일수록 눈에 보여야 열어보게 된다.
    -->
    <p class="section">
        참여 중인 방
        <!--
          코드 입력을 목록 옆에 둔다.
          예전에는 /spaces 화면 맨 아래에만 있었다. 코드를 받은 사람은
          '어디에 넣지' 부터 찾아야 했고, 그 화면까지 가는 길도 눈에 띄지 않았다.
          받은 즉시 쓰는 물건은 받는 사람이 서 있는 자리에 있어야 한다.
        -->
        <button type="button" class="link btn-plain" style="font-size:16px"
                onclick="joinBox.showModal()">· 코드로 참여</button>
    </p>

    <div class="msg"     th:if="${message}" th:text="${message}">안내</div>
    <div class="msg err" th:if="${error}"   th:text="${error}">오류</div>

    <!--
      dialog 는 브라우저가 기본으로 갖고 있는 '작은 창' 태그다.
      직접 만들면 뒤 배경 가리기, ESC 로 닫기, 열렸을 때 뒤쪽 클릭 막기를
      모두 손으로 짜야 한다. 그 동작들이 이미 들어 있어 그대로 쓴다.
    -->
    <dialog id="joinBox" class="sketch">
        <form method="dialog" class="dialog-x">
            <button class="btn-plain" aria-label="닫기">✕</button>
        </form>

        <h2>코드로 참여하기</h2>
        <p class="hint">방을 만든 사람에게 받은 8자리 코드를 넣어주세요.</p>

        <!--
          method="get" 이라 초대 링크를 눌러 들어오는 경로와 같은 곳으로 간다.
          처리하는 곳이 하나여야 규칙이 갈라지지 않는다.

          from 은 실패했을 때 돌아올 자리다. 없으면 /spaces 로 떨어져
          방금 있던 화면을 잃는다. 값은 서버가 다시 검사한다.
        -->
        <form class="row" th:action="@{/spaces/join}" method="get">
            <input type="hidden" name="from" value="/">
            <input type="text" name="code" placeholder="예) A3K9PQ7M"
                   maxlength="16" required autofocus
                   autocomplete="off" style="text-transform: uppercase">
            <button type="submit" class="btn">참여</button>
        </form>
    </dialog>

    <div class="rooms">
        <a class="room sketch" th:each="space : ${spaces}"
           th:href="@{/spaces/{id}(id=${space.spaceId})}">
            <span class="name" th:text="${space.name}">방 이름</span>
            <span class="sub">
                <span th:text="'멤버 ' + ${space.memberCount} + '명'">멤버 수</span>
                <span th:if="${space.owner}"> · 내가 만듦</span>
            </span>
        </a>

        <!-- 방이 없어도 이 자리는 비워두지 않는다. 무엇을 할 수 있는지 보여준다 -->
        <a class="room add sketch" th:href="@{/spaces}" title="방 만들기 / 참여하기">+</a>
    </div>

    <!-- ── 내 갤러리 ──────────────────────────────────────── -->
    <p class="section section-gap">
        내 갤러리
        <a class="link" th:href="@{/posts/new}" style="font-size:16px"> · 기록 올리기</a>
    </p>

    <p class="empty" th:if="${#lists.isEmpty(posts)}">
        아직 기록이 없습니다. 첫 사진을 올려보세요.
    </p>

    <div class="gallery" id="gallery">
        <!-- 첫 페이지도 이어붙일 때와 같은 조각을 쓴다 -->
        <th:block th:replace="~{post/fragments/gallery-cards :: cards}"></th:block>
    </div>

    <div class="foot" id="loading" hidden>불러오는 중…</div>

    <!--
      더 가져올 게 있을 때만 감시 칸을 둔다.
      기록이 한 페이지 안에 다 들어가면 이 칸 자체가 없으므로 요청이 아예 일어나지 않는다.
    -->
    <div id="sentinel" th:if="${hasNext}" th:attr="data-next-page=${nextPage}"></div>

</div>

<!--
  촬영 버튼은 이 화면에만 넣는다.
  layout 의 머리말에 함께 두면 글 쓰는 화면에도 떠서,
  작성 중에 눌렀을 때 하던 일이 날아간다.
-->
<th:block th:replace="~{fragments/layout :: shotButton(${loginMember})}"></th:block>

<script th:replace="~{post/fragments/infinite-scroll :: script(null)}"></script>

</body>
</html>
