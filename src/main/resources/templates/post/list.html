<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('mealmate')}"></head>
<body>

<div class="sheet">

    <th:block th:replace="~{fragments/layout :: pageTop(${loginMember})}"></th:block>

    <!-- ── 참여 중인 방 ───────────────────────────────────── -->
    <!--
      방을 첫 화면에 펼쳐둔다.
      링크 하나로 두면 존재를 잊는다. 함께 쓰는 공간일수록 눈에 보여야 열어보게 된다.
    -->
    <p class="section">참여 중인 방</p>

    <div class="rooms">
        <a class="room sketch" th:each="space : ${spaces}"
           th:href="@{/spaces/{id}(id=${space.spaceId})}">
            <span class="name" th:text="${space.name}">방 이름</span>
            <span class="sub">
                <span th:text="'멤버 ' + ${space.memberCount} + '명'">멤버 수</span>
                <span th:if="${space.owner}"> · 내가 만듦</span>
            </span>
        </a>

        <!-- 방이 없어도 이 자리는 비워두지 않는다. 무엇을 할 수 있는지 보여준다 -->
        <a class="room add sketch" th:href="@{/spaces}" title="방 만들기 / 참여하기">+</a>
    </div>

    <!-- ── 내 갤러리 ──────────────────────────────────────── -->
    <p class="section section-gap">
        내 갤러리
        <a class="link" th:href="@{/posts/new}" style="font-size:16px"> · 기록 올리기</a>
    </p>

    <p class="empty" th:if="${#lists.isEmpty(posts)}">
        아직 기록이 없습니다. 첫 사진을 올려보세요.
    </p>

    <div class="gallery" id="gallery">
        <!-- 첫 페이지도 이어붙일 때와 같은 조각을 쓴다 -->
        <th:block th:replace="~{post/fragments/gallery-cards :: cards}"></th:block>
    </div>

    <div class="foot" id="loading" hidden>불러오는 중…</div>

    <!--
      더 가져올 게 있을 때만 감시 칸을 둔다.
      기록이 한 페이지 안에 다 들어가면 이 칸 자체가 없으므로 요청이 아예 일어나지 않는다.
    -->
    <div id="sentinel" th:if="${hasNext}" th:attr="data-next-page=${nextPage}"></div>

</div>

<script th:replace="~{post/fragments/infinite-scroll :: script(null)}"></script>

</body>
</html>
