<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 모바일에서 화면 너비에 맞춰 표시되도록 한다. 없으면 PC 화면을 축소해서 보여준다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>갤러리</title>
    <style>
        body {
            max-width: 960px;
            margin: 0 auto;
            padding: 16px;
            font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
        }

        /*
          격자 배치.
          grid-template-columns: repeat(3, 1fr) 는 "같은 너비의 칸 3개" 라는 뜻이다.
          1fr 은 남은 공간을 균등하게 나눈다는 의미라, 화면이 넓든 좁든 항상 3열이 된다.
        */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        /*
          썸네일은 정사각형으로 통일한다.
          사진마다 원본 비율이 다르므로 aspect-ratio 로 틀을 고정하고
          object-fit: cover 로 넘치는 부분만 잘라낸다. 비율이 깨지지 않는다.
        */
        .gallery img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        /* 사진이 없는 기록도 격자에서 자리를 차지하도록 같은 크기로 둔다 */
        .no-photo {
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            background: #eee;
            color: #888;
            font-size: 13px;
        }

        /*
          격자 맨 아래에 두는 감시용 칸.
          이 칸이 화면에 들어오면 "끝까지 스크롤했다" 는 신호로 삼는다.
          높이가 0 이면 화면에 들어왔는지 판단이 애매해지므로 최소 높이를 준다.
        */
        #sentinel {
            height: 1px;
        }

        .loading {
            padding: 16px 0;
            text-align: center;
            color: #888;
            font-size: 13px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<h1>내 음식 기록</h1>

<!--
  로그인 상태에 따라 다른 것을 보여준다.
  loginMember 는 로그인하지 않았으면 null 이다.
-->
<div class="topbar">
    <a th:href="@{/posts/new}">기록 올리기</a>

    <span th:if="${loginMember != null}">
        <span th:text="${loginMember.nickname} + '님'">닉네임</span>
        <!-- 로그아웃은 서버 상태를 바꾸므로 링크가 아니라 폼(POST)이다 -->
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit">로그아웃</button>
        </form>
    </span>

    <a th:if="${loginMember == null}" th:href="@{/login}">로그인</a>
</div>

<p th:if="${#lists.isEmpty(posts)}">아직 기록이 없습니다.</p>

<!--
  인스타그램 프로필처럼 사진만 격자로 보여준다.
  닉네임·코멘트·식당은 상세 화면에서 확인한다. 목록은 사진 자체가 콘텐츠다.
  정렬은 먹은 날짜 최신순이다. 저장한 날짜가 아니라는 점이 중요하다.
-->
<div class="gallery" id="gallery">
    <!-- 첫 페이지도 이어붙일 때와 같은 조각을 쓴다 -->
    <th:block th:replace="~{post/fragments/gallery-cards :: cards}"></th:block>
</div>

<div class="loading" id="loading" hidden>불러오는 중…</div>

<!--
  더 가져올 게 있을 때만 감시 칸을 둔다.
  게시물이 한 페이지 안에 다 들어가면 이 칸 자체가 없으므로 요청이 아예 일어나지 않는다.
-->
<div id="sentinel" th:if="${hasNext}" th:attr="data-next-page=${nextPage}"></div>

<script>
    (function () {
        const sentinel = document.getElementById('sentinel');
        if (!sentinel) {
            return;   // 다음 페이지가 없으면 할 일이 없다
        }

        const gallery = document.getElementById('gallery');
        const loading = document.getElementById('loading');

        let nextPage = Number(sentinel.dataset.nextPage);

        // 요청을 보내는 중인지 표시한다.
        // 이게 없으면 스크롤이 걸쳐 있는 동안 같은 페이지를 여러 번 요청해 사진이 중복된다.
        let loadingNow = false;

        async function loadNext() {
            if (loadingNow) {
                return;
            }
            loadingNow = true;
            loading.hidden = false;

            try {
                const res = await fetch('/posts/more?page=' + nextPage);
                if (!res.ok) {
                    throw new Error('HTTP ' + res.status);
                }

                // 받은 것은 사진 칸 HTML 조각이다. 격자 끝에 그대로 덧붙인다.
                gallery.insertAdjacentHTML('beforeend', await res.text());

                // 다음이 남았는지는 본문이 아니라 헤더가 알려준다
                if (res.headers.get('X-Has-Next') === 'true') {
                    nextPage += 1;
                } else {
                    // 더 없으면 감시를 멈추고 칸을 치운다. 안 그러면 계속 요청한다
                    observer.disconnect();
                    sentinel.remove();
                }
            } catch (e) {
                // 실패했다고 감시를 끊지는 않는다. 잠시 끊긴 것일 수 있으므로
                // 다시 스크롤하면 재시도된다.
                console.error('다음 페이지를 불러오지 못했습니다.', e);
            } finally {
                loadingNow = false;
                loading.hidden = true;
            }
        }

        /*
          IntersectionObserver 는 "이 요소가 화면에 보이는가" 를 브라우저가 알려주는 기능이다.

          scroll 이벤트로 직접 계산하지 않는 이유:
            scroll 은 스크롤하는 내내 수십 번씩 발생해서 그때마다 위치를 계산해야 한다.
            IntersectionObserver 는 보이기 시작하는 순간에만 한 번 알려주므로 훨씬 가볍다.

          rootMargin 은 감시 범위를 넓힌다. 400px 을 주면 감시 칸이 화면에
          닿기 400px 전에 미리 불러와서, 사용자가 빈 화면을 보지 않는다.
        */
        const observer = new IntersectionObserver(function (entries) {
            if (entries[0].isIntersecting) {
                loadNext();
            }
        }, { rootMargin: '400px' });

        observer.observe(sentinel);
    })();
</script>

</body>
</html>
