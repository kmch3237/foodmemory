<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>갤러리</title>
</head>
<body>

<!--
  스타일은 일부러 넣지 않는다.
  지금 목적은 예쁜 화면이 아니라, 브라우저 요청부터 DB까지 길이 뚫렸는지 확인하는 것이다.
-->

<h1>내 음식 기록</h1>

<p><a th:href="@{/posts/new}">기록 올리기</a></p>

<p th:if="${#lists.isEmpty(posts)}">아직 기록이 없습니다.</p>

<ul>
    <li th:each="post : ${posts}">

        <!--
          사진 주소는 DB에 저장된 상대 경로 앞에 접두사를 붙여 만든다.
            DB      2026/08/3f8c1e9a.jpg
            접두사   /uploads
            최종     /uploads/2026/08/3f8c1e9a.jpg
          접두사를 DB에 넣지 않았기 때문에, 나중에 S3로 옮겨도 설정만 바꾸면 된다.
        -->
        <!-- th:href 로 상세 화면 주소를 만든다. @{/posts/{id}(id=...)} 형태로 값을 끼워 넣는다 -->
        <a th:href="@{/posts/{id}(id=${post.postId})}">
            <img th:if="${post.thumbnailPath != null}"
                 th:src="@{${uploadUrlPrefix} + '/' + ${post.thumbnailPath}}"
                 alt="음식 사진" width="200">
            <span th:if="${post.thumbnailPath == null}">[사진 없음]</span>
        </a>

        <strong th:text="${post.writerNickname}">닉네임</strong>
        <span th:text="${#temporals.format(post.eatenDate, 'yyyy-MM-dd HH:mm')}">날짜</span>
        <span th:if="${!#strings.isEmpty(post.content)}" th:text="${post.content}">코멘트</span>
        <span th:if="${post.restaurantName != null}"
              th:text="'@ ' + ${post.restaurantName}">식당</span>
    </li>
</ul>

</body>
</html>
