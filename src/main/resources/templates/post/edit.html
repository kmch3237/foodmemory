<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('기록 수정 · mealmate')}"></head>
<body>

<div class="sheet">

    <th:block th:replace="~{fragments/layout :: pageTop(${loginMember})}"></th:block>

    <div class="column">

    <p class="back"><a th:href="@{/posts/{id}(id=${form.postId})}">← 기록으로 돌아가기</a></p>

    <p class="section">기록 수정</p>

    <!--
      등록 폼과 달리 enctype 이 없다. 파일을 보내지 않기 때문이다.
      사진은 수정 대상이 아니다. 잘못 올렸으면 기록을 지우고 다시 올린다.
    -->
    <form th:action="@{/posts/{id}/edit(id=${form.postId})}" method="post">

        <label class="field">
            <span>어디에 올릴까요?</span>
            <!--
              th:selected 로 지금 값을 미리 골라둔다.
              이게 없으면 수정 화면을 열 때마다 '나만 보기' 가 선택된 것처럼 보이고,
              사용자가 공간을 건드리지 않고 저장해도 개인 기록으로 바뀌어 버린다.
              폼은 언제나 '지금 저장된 값' 을 그대로 보여줘야 한다.
            -->
            <select name="spaceId">
                <option value="" th:selected="${form.spaceId == null}">나만 보기 (개인 기록)</option>
                <option th:each="space : ${spaces}"
                        th:value="${space.spaceId}"
                        th:text="${space.name}"
                        th:selected="${space.spaceId == form.spaceId}">방 이름</option>
            </select>
            <span class="hint">방에서 빼면 그 방의 다른 멤버는 이 기록을 볼 수 없게 됩니다.</span>
        </label>

        <label class="field">
            <span>먹은 날짜</span>
            <!--
              datetime-local 입력칸은 "2026-08-14T19:30" 형태의 값만 알아본다.
              #temporals.format 으로 그 형태에 맞춰 넣어야 지금 값이 채워진 채로 열린다.
              형식이 어긋나면 브라우저가 값을 통째로 무시해 빈 칸으로 보인다.
            -->
            <input type="datetime-local" name="eatenDate"
                   th:value="${#temporals.format(form.eatenDate, 'yyyy-MM-dd''T''HH:mm')}">
            <span class="hint">비워두면 지금 날짜를 그대로 둡니다.</span>
        </label>

        <label class="field">
            <span>코멘트 (선택)</span>
            <!--
              textarea 는 value 속성이 없다. 태그 사이의 내용이 곧 값이라
              th:text 로 채운다. th:value 를 쓰면 아무것도 나타나지 않는다.
            -->
            <textarea name="content" rows="3" maxlength="500" th:text="${form.content}"></textarea>
        </label>

        <button type="submit" class="btn wide">저장</button>
    </form>

    </div>
</div>

</body>
</html>
