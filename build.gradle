plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.foodmemory'
version = '0.0.1-SNAPSHOT'
description = '음식 추억 기록 서비스'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 웹 요청/응답 처리, 내장 톰캣, @Controller
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// JPA + Hibernate + Spring Data Repository
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// HTML 템플릿 엔진
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

	// getter/setter 등을 컴파일 시점에 생성한다.
	// compileOnly  : 컴파일할 때만 필요 (실행 시에는 이미 코드가 만들어져 있음)
	// annotationProcessor : @Getter 같은 어노테이션을 읽고 실제 코드를 만들어 넣는 역할
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 코드를 고치면 서버를 자동으로 재시작한다. 배포본에는 포함되지 않는다.
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// 사진의 EXIF(촬영 시각, GPS 좌표 등)를 읽는다.
	// Spring 이 관리하는 라이브러리가 아니라 서드파티이므로 버전을 직접 적어야 한다.
	implementation 'com.drewnoakes:metadata-extractor:2.19.0'

	// 비밀번호 해싱(BCrypt)만 쓰기 위한 모듈.
	//
	// spring-boot-starter-security 를 넣지 않은 이유:
	//   그건 필터 체인·인증 매니저·기본 로그인 화면까지 통째로 딸려와서
	//   모든 요청이 프레임워크의 보안 필터를 먼저 지나게 된다.
	//   우리는 세션과 인터셉터로 직접 인증을 다루기로 했으므로 서로 부딪힌다.
	// 이 모듈은 BCryptPasswordEncoder 같은 도구만 들어 있어 아무것도 가로채지 않는다.
	implementation 'org.springframework.security:spring-security-crypto'

	// 세션을 톰캣 메모리가 아니라 Redis 에 저장한다.
	//
	// 왜 필요한가:
	//   세션은 원래 톰캣의 메모리 안에 있다. 배포할 때마다 systemctl restart 로
	//   프로세스가 새로 뜨는데, 그 순간 모든 사람의 로그인이 한 번에 풀린다.
	//   Redis 는 앱과 따로 도는 저장소라, 앱이 죽었다 살아나도 세션이 그대로 남는다.
	//   나중에 서버를 두 대로 늘릴 때도 두 서버가 같은 세션을 보게 된다.
	//
	// 두 개를 넣는 이유:
	//   data-redis         : Redis 와 말을 주고받는 연결 담당
	//   session-data-redis : HttpSession 을 가로채 Redis 에 넣고 빼는 담당
	//
	// 우리 코드는 한 줄도 바뀌지 않는다. session.setAttribute 를 그대로 쓰고,
	// 그 값이 어디에 저장되는지만 달라진다.
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.session:spring-session-data-redis'

	// MySQL 접속 드라이버.
	// 우리 코드에서 직접 부르지 않고 JPA가 사용하므로 runtimeOnly.
	runtimeOnly 'com.mysql:mysql-connector-j'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
